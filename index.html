<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omniEco - Kỹ thuật Môi trường</title>
    <meta name="description" content="Ứng dụng tính toán thông số thủy lực và thiết kế công trình xử lý nước thải theo tiêu chuẩn kỹ thuật môi trường." />
    <meta property="og:title" content="omniEco - Kỹ thuật Môi trường" />
    <meta property="og:description" content="Ứng dụng tính toán thông số thủy lực và thiết kế công trình xử lý nước thải theo tiêu chuẩn kỹ thuật môi trường." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('omniEco_Theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-200 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
